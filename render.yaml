services:
  - type: web
    name: my-csit-sheet
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build
    startCommand: npm run start:production
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.21.0
      - key: DATABASE_PATH
        value: /var/data/csit-sheet.sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 7
      - key: ALLOWED_ORIGINS
        sync: false
    disk:
      name: csit-sheet-data
      mountPath: /var/data
      sizeGB: 1
