[build]
  command = "npm ci && npm run build"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  # Source entries are prebundled as ESM so backend import.meta semantics remain valid.
  node_bundler = "esbuild"
  included_files = ["backend/data/registrar/**"]
  external_node_modules = ["@netlify/blobs", "@netlify/database", "pg"]

[[redirects]]
  from = "/api/blob/*"
  to = "/.netlify/functions/blob/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
