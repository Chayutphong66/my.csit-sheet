name: PostgreSQL Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: csit_sheet_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d csit_sheet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/csit_sheet_test
      TEST_RESTORE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/csit_sheet_restore_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run PostgreSQL integration and concurrency guards
        run: npm run test:postgres
      - name: Back up isolated test database
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/phase7-evidence"
          docker exec "$POSTGRES_CONTAINER_ID" pg_dump --username=postgres --dbname=csit_sheet_test --format=custom --no-owner --file=/tmp/csit_sheet_test.dump
          docker cp "$POSTGRES_CONTAINER_ID:/tmp/csit_sheet_test.dump" "$RUNNER_TEMP/csit_sheet_test.dump"
          sha256sum "$RUNNER_TEMP/csit_sheet_test.dump" > "$RUNNER_TEMP/phase7-evidence/backup.sha256"
      - name: Restore into a second isolated test database
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER_ID" createdb --username=postgres csit_sheet_restore_test
          docker exec "$POSTGRES_CONTAINER_ID" pg_restore --username=postgres --dbname=csit_sheet_restore_test --no-owner --exit-on-error /tmp/csit_sheet_test.dump
      - name: Verify restored ledger, schema and row counts
        run: npm run verify:postgres-restore
      - name: Export non-secret migration and storage inventory
        run: |
          npm run export:postgres-inventory > "$RUNNER_TEMP/phase7-evidence/postgres-inventory.json"
      - uses: actions/upload-artifact@v4
        with:
          name: phase7-postgres-evidence
          path: ${{ runner.temp }}/phase7-evidence/
          retention-days: 7
          if-no-files-found: error
