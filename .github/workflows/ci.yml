name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrate fresh database
        run: npm run db:migrate
        env:
          DATABASE_PATH: /tmp/csit-sheet-ci.sqlite
      - name: Seed fresh database
        run: npm run db:seed
        env:
          DATABASE_PATH: /tmp/csit-sheet-ci.sqlite
      - run: npm test
      - run: npm run lint
      - run: npm run build
